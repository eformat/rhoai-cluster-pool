---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: perf-enhancements
placementBindingDefaults:
  name: perf-enhancements
policyDefaults:
  placement:
    placementName: placement-spokes-prelude
  categories:
    - CM Configuration Management
  complianceType: "musthave"
  controls:
    - CM-2 Baseline Configuration
  configurationPolicyAnnotations: {"policy.open-cluster-management.io/disable-templates": "true"}
  consolidateManifests: false
  copyPolicyMetadata: false
  disabled: false
  namespace: openshift-gitops
  pruneObjectBehavior: "None"
  remediationAction: enforce
  severity: medium
  standards:
    - NIST SP 800-53
  policyAnnotations: {"argocd.argoproj.io/compare-options": "IgnoreExtraneous"}
policies:
  - name: perf-enhancements
    manifests:
      - path: input/
  # Same bundle for the OCP 5 pool clusters: the compact single-node
  # ocp5-m6wl4-* clusters hit the default maxPods=250 ceiling (286 pods
  # scheduled 2026-11-05) and the rhcl-operator bundle-unpack pod could not
  # be scheduled ("Too many pods") until maxPods is raised.
  - name: perf-enhancements-ocp5
    placement:
      placementName: placement-spokes-perf-enhancements-ocp5
    manifests:
      - path: input/
