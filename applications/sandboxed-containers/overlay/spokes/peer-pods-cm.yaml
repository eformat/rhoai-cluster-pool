# Peer pods configuration for AWS.
# The OSC operator reads this ConfigMap from its own namespace to learn how
# to create pod VMs. AWS_REGION must match the cluster region.
# PODVM_INSTANCE_TYPE can be tuned per spoke via a kustomize patch.
# OSC 1.13 requires the AWS networking keys (AWS_SUBNET_ID/AWS_VPC_ID/
# AWS_SG_IDS) to be present and non-empty or the image-generator validation
# fails and the operator falls back to DaemonSet (local kata) mode.
# Pattern B: the values flow from vault (coco/networking, seeded per spoke
# by secrets/vault-coco) via the peer-pods-secret-spokes ESO → the plain
# ConfigMap coco-networking on the spoke, read here via {{fromConfigMap}}
# (fromSecret would return base64-encoded Secret data).
apiVersion: v1
kind: ConfigMap
metadata:
  name: peer-pods-cm
  namespace: openshift-sandboxed-containers-operator
data:
  CLOUD_PROVIDER: "aws"
  AWS_REGION: "us-east-2"
  AWS_SUBNET_ID: '{{fromConfigMap "openshift-sandboxed-containers-operator" "coco-networking" "AWS_SUBNET_ID"}}'
  AWS_VPC_ID: '{{fromConfigMap "openshift-sandboxed-containers-operator" "coco-networking" "AWS_VPC_ID"}}'
  AWS_SG_IDS: '{{fromConfigMap "openshift-sandboxed-containers-operator" "coco-networking" "AWS_SG_IDS"}}'
  # Pod VM AMI built by the osc-podvm-image-creation job (per spoke). When
  # set, the OSC skips the image job. Rebuild: delete the job + remove this
  # key, and the OSC regenerates it.
  PODVM_AMI_ID: "ami-056cc016bbe3cddc3"
  # Default pod VM instance type (override per spoke if needed)
  PODVM_INSTANCE_TYPE: "t3.large"
  # CoCo initdata (aa.toml + cdh.toml with the KBS URL/cert + policy.rego),
  # generated by the initdata-gzipper Job (coco-kyverno-policies app) into
  # imperative/initdata. REQUIRED: with the CoCo feature gate enabled the OSC
  # leaves this key alone; without it the OSC stamps its policy-only
  # defaultNonCCInitdata (no cdh.toml/KBS URL) on every reconcile and the CDH
  # inside the pod VM fails with "Get resource failed: ttrpc request error".
  INITDATA: '{{fromConfigMap "imperative" "initdata" "INITDATA"}}'
