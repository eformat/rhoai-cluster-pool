# AWS credentials for peer pod VM lifecycle (create/run/terminate EC2
# instances). Seeded to vault at kv/data/ocp/sno/openshift-gitops/coco/peer-pods by
# bootstrap/seed-vault-coco.sh. See COCO.md for the required IAM policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: peer-pods-aws-creds
  namespace: openshift-sandboxed-containers-operator
spec:
  refreshInterval: "1m0s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: peer-pods-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kv/data/ocp/sno/openshift-gitops/coco/peer-pods
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kv/data/ocp/sno/openshift-gitops/coco/peer-pods
        property: AWS_SECRET_ACCESS_KEY
