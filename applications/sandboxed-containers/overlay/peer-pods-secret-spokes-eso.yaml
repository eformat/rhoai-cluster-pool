# AWS credentials for peer pod VM lifecycle (create/run/terminate EC2
# instances) plus the AWS networking values OSC 1.13 requires in
# peer-pods-cm (AWS_SUBNET_ID/AWS_VPC_ID/AWS_SG_IDS). The credentials are
# NOT in vault: they are hydrated ON the spoke from the Hive-managed
# kube-system/aws-creds Secret via ACM's fromSecret (evaluated spoke-side,
# same pattern as policy-collection's aws-creds-spokes policy — the same
# credential, verified identical). The hub ESO only reads the networking
# values from vault (kv/data/ocp/sno/openshift-gitops/coco/networking,
# subnet/vpc/sg via secrets/vault-coco) and bakes them into the Policy as a
# plain ConfigMap. See COCO.md.
# NOTE: the credentials use `data` (NOT stringData) because ACM's
# fromSecret returns the Secret's base64-encoded .data value (hub- and
# spoke-side), while fromConfigMap returns plain ConfigMap data. The
# networking identifiers are not credentials, so a ConfigMap is fine.
# NOTE: the networking keys ride this policy (not a separate
# coco-networking policy) because manually-created PlacementBindings in
# openshift-gitops get deleted within seconds by an unidentified actor; this
# policy's distribution is already established (sticky).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: peer-pods-secret-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: peer-pods-secret-spokes
    manifest:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          policy.open-cluster-management.io/categories: CM Configuration Management
          policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
          policy.open-cluster-management.io/standards: NIST SP 800-53
        labels:
          requires-rolling-restart: none
      templateFrom:
      - literal: |
          disabled: false
          policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: peer-pods-secret-spokes
              spec:
                object-templates:
                  - complianceType: musthave
                    objectDefinition:
                      kind: Secret
                      apiVersion: v1
                      # fromSecret is evaluated SPOKE-side (no `hub`
                      # prefix) — kube-system/aws-creds is Hive-managed on
                      # every spoke. It returns the base64-encoded .data
                      # value, so the keys use `data` (not stringData).
                      # Double braces are escaped for the ESO v2 Go
                      # template engine, AND the result must stay
                      # single-quoted: ESO unmarshals the rendered literal
                      # as YAML, and an unquoted {{...}} is a flow mapping
                      # -> "invalid map key" render failure.
                      data:
                        AWS_ACCESS_KEY_ID: '{{"{{"}}fromSecret "kube-system" "aws-creds" "aws_access_key_id"{{"}}"}}'
                        AWS_SECRET_ACCESS_KEY: '{{"{{"}}fromSecret "kube-system" "aws-creds" "aws_secret_access_key"{{"}}"}}'
                      metadata:
                        name: peer-pods-secret
                        namespace: openshift-sandboxed-containers-operator
                      type: Opaque
                  - complianceType: musthave
                    objectDefinition:
                      kind: ConfigMap
                      apiVersion: v1
                      data:
                        AWS_SUBNET_ID: {{.awsSubnetId}}
                        AWS_VPC_ID: {{.awsVpcId}}
                        AWS_SG_IDS: {{.awsSgIds}}
                      metadata:
                        name: coco-networking
                        namespace: openshift-sandboxed-containers-operator
                remediationAction: inform
                severity: low
          remediationAction: enforce
        target: spec
  data:
  - secretKey: awsSubnetId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SUBNET_ID
  - secretKey: awsVpcId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_VPC_ID
  - secretKey: awsSgIds
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SG_IDS
