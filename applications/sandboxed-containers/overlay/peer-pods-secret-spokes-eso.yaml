# AWS credentials for peer pod VM lifecycle (create/run/terminate EC2
# instances) plus the AWS networking values OSC 1.13 requires in
# peer-pods-cm (AWS_SUBNET_ID/AWS_VPC_ID/AWS_SG_IDS). Pattern B
# (hub-trusted): the ESO runs on the HUB, reads the values from vault and
# bakes them into a Policy; ACM copies them to the spoke — creds as a plain
# Secret, networking as a plain ConfigMap. Seeded to vault at
# kv/data/ocp/sno/openshift-gitops/coco/peer-pods (creds) and coco/networking
# (subnet/vpc/sg) via the secrets/vault-coco method. See COCO.md.
# NOTE: networking goes in a ConfigMap (NOT the Secret) because ACM's
# fromSecret returns the Secret's base64-encoded .data value (hub- and
# spoke-side), while fromConfigMap returns plain ConfigMap data. The
# networking identifiers are not credentials, so a ConfigMap is fine.
# NOTE: the networking keys ride this policy (not a separate
# coco-networking policy) because manually-created PlacementBindings in
# openshift-gitops get deleted within seconds by an unidentified actor; this
# policy's distribution is already established (sticky).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: peer-pods-secret-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: peer-pods-secret-spokes
    manifest:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          policy.open-cluster-management.io/categories: CM Configuration Management
          policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
          policy.open-cluster-management.io/standards: NIST SP 800-53
        labels:
          requires-rolling-restart: none
      templateFrom:
      - literal: |
          disabled: false
          policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: peer-pods-secret-spokes
              spec:
                object-templates:
                  - complianceType: musthave
                    objectDefinition:
                      kind: Secret
                      apiVersion: v1
                      stringData:
                        AWS_ACCESS_KEY_ID: {{.awsAccessKeyId}}
                        AWS_SECRET_ACCESS_KEY: {{.awsSecretAccessKey}}
                      metadata:
                        name: peer-pods-secret
                        namespace: openshift-sandboxed-containers-operator
                      type: Opaque
                  - complianceType: musthave
                    objectDefinition:
                      kind: ConfigMap
                      apiVersion: v1
                      data:
                        AWS_SUBNET_ID: {{.awsSubnetId}}
                        AWS_VPC_ID: {{.awsVpcId}}
                        AWS_SG_IDS: {{.awsSgIds}}
                      metadata:
                        name: coco-networking
                        namespace: openshift-sandboxed-containers-operator
                remediationAction: inform
                severity: low
          remediationAction: enforce
        target: spec
  data:
  - secretKey: awsAccessKeyId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/peer-pods
      property: AWS_ACCESS_KEY_ID
  - secretKey: awsSecretAccessKey
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/peer-pods
      property: AWS_SECRET_ACCESS_KEY
  - secretKey: awsSubnetId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SUBNET_ID
  - secretKey: awsVpcId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_VPC_ID
  - secretKey: awsSgIds
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SG_IDS
