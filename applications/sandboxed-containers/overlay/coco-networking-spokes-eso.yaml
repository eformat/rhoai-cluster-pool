# Spoke AWS networking values for peer pods (OSC 1.13 requires
# AWS_SUBNET_ID/AWS_VPC_ID/AWS_SG_IDS in peer-pods-cm). Pattern B
# (hub-trusted): the ESO runs on the HUB, reads the values from vault
# (seeded per spoke by secrets/vault-coco as coco/networking) and bakes
# them into a Policy; ACM copies them to the spoke as a plain Secret
# (coco-networking). The peer-pods-cm template reads them via
# {{fromSecret "openshift-sandboxed-containers-operator" "coco-networking" ...}}.
# NOTE: hub-side {{hub fromSecret ... | base64dec hub}} was tried and does
# NOT work — base64dec errors at policy distribution and ACM bakes the Go
# error text into the value. Do not switch this to hub-side templating.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coco-networking-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: coco-networking-spokes
    manifest:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          policy.open-cluster-management.io/categories: CM Configuration Management
          policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
          policy.open-cluster-management.io/standards: NIST SP 800-53
        labels:
          requires-rolling-restart: none
      templateFrom:
      - literal: |
          disabled: false
          policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: coco-networking-spokes
              spec:
                object-templates:
                  - complianceType: musthave
                    objectDefinition:
                      kind: Secret
                      apiVersion: v1
                      stringData:
                        AWS_SUBNET_ID: {{.awsSubnetId}}
                        AWS_VPC_ID: {{.awsVpcId}}
                        AWS_SG_IDS: {{.awsSgIds}}
                      metadata:
                        name: coco-networking
                        namespace: openshift-sandboxed-containers-operator
                      type: Opaque
                remediationAction: inform
                severity: low
          remediationAction: enforce
        target: spec
  data:
  - secretKey: awsSubnetId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SUBNET_ID
  - secretKey: awsVpcId
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_VPC_ID
  - secretKey: awsSgIds
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SG_IDS
