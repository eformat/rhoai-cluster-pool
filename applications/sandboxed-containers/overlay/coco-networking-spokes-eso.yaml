# Spoke AWS networking values for peer pods (OSC 1.13 requires
# AWS_SUBNET_ID/AWS_VPC_ID/AWS_SG_IDS in peer-pods-cm). Pattern B
# (hub-trusted): the ESO runs on the HUB, reads the values from vault
# (seeded per spoke by secrets/vault-coco as coco/networking) and creates
# a plain Secret ON THE HUB. The peer-pods-cm policy reads them via
# {{hub fromSecret ... hub}} at policy distribution.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coco-networking-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: coco-networking-hub
    creationPolicy: Owner
  data:
  - secretKey: AWS_SUBNET_ID
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SUBNET_ID
  - secretKey: AWS_VPC_ID
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_VPC_ID
  - secretKey: AWS_SG_IDS
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/networking
      property: AWS_SG_IDS
