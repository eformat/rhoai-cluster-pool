---
apiVersion: mcp.x-k8s.io/v1beta1
kind: MCPServer
metadata:
  name: test-mcp-server
  namespace: mcp-test
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: quay.io/containers/kubernetes_mcp_server:latest
  config:
    port: 8080
    path: /mcp
  gateway:
    provider: kuadrant
    configRef: kuadrant-gateway-config
