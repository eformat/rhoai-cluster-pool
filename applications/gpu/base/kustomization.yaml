---
resources:
  - nfd-cr.yaml
#  - nfd-rbac-hack.yaml  # broken in 4.19.1
  - nvidia-dcgm-exporter-dashboard-cm.yaml

# cluster-policy + time-slicing configmap moved to components/device-plugin-stack
# DRA stack (GPUCluster/NVIDIADriver) lives in components/dra-stack

helmGlobals:
  chartHome: ../../olm

helmCharts:
  - name: olm-v0-chart
    includeCRDs: true
    releaseName: olm-v0-chart
    valuesFile: values-v0.yaml

  - name: olm-v1-chart
    includeCRDs: true
    releaseName: olm-v1-chart
    valuesFile: values-v1.yaml
