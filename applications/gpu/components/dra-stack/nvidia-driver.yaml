---
apiVersion: nvidia.com/v1alpha1
kind: NVIDIADriver
metadata:
  name: gpu-driver
  namespace: nvidia-gpu-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  driverType: gpu
  repository: nvcr.io/nvidia
  image: driver
  # driver shipped with gpu-operator 26.7.3 (DRA driver requires >= 580)
  # alternative: pin the operator CSV's driver-image digest instead of the release tag
  version: "595.91.07"
  nodeSelector:
    feature.node.kubernetes.io/pci-10de.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
