---
# cluster-scoped singleton - the name MUST be gpu-cluster
# DRA stack alternative to ClusterPolicy: a cluster must have either
# GPUCluster or ClusterPolicy, never both
apiVersion: nvidia.com/v1alpha1
kind: GPUCluster
metadata:
  name: gpu-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  draDriver:
    # Dynamic MIG (alpha): the DRA driver creates/destroys MIG partitions
    # per ResourceClaim; kubelet plugin owns the MIG config on the node.
    # K8s >= 1.36 (OCP 5.x) enables DRAPartitionableDevices by default.
    # Dormant on L40S (no MIG silicon) - activates on MIG-capable nodes
    # (A100/H100/H200/B200/RTX PRO 6000 Blackwell).
    featureGates:
      DynamicMIG: true
      # Time-slicing (alpha): share one full GPU across containers/pods via
      # CUDA context switching - per-claim GpuConfig sharing.strategy:
      # TimeSlicing (interval: Default|Short|Medium|Long). No memory
      # isolation; mutually exclusive with MPS on the same GPU.
      TimeSlicingSettings: true
      # Consumable shares (alpha): system-mediated GPU sharing - the driver
      # republishes ResourceSlices with allowMultipleAllocations: true and a
      # fixed share count, so INDEPENDENT per-pod ResourceClaims (the shape
      # dashboard DRA hardware profiles generate) co-allocate one GPU,
      # scheduler-enforced. The DRA analog of the old device-plugin
      # time-slicing 'replicas'; k8s 1.36 has DRAConsumableCapacity on by
      # default. MPS must not be used on shared claims.
      ConsumableShares: true
    # CONSUMABLE_SHARES mode: positive integer = N shares per GPU/device,
    # each claim consumes one share unless it requests more via
    # capacity.requests. 4 mirrors the old device-plugin
    # timeSlicing.replicas: 4 - four concurrent workbenches per L40S.
    # Alternatives: 'memory' (claims consume advertised memory unless they
    # request less) or 'unlimited' (no scheduler cap - avoid on shared
    # nodes). Requires the ConsumableShares gate above.
    gpus:
      kubeletPlugin:
        env:
          - name: CONSUMABLE_SHARES
            value: "4"
    computeDomains:
      enabled: false
  daemonsets:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  dcgmExporter:
    enabled: true
