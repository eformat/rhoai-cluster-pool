---
# Per-project LocalQueue for the DRA HardwareProfile (localQueueName: default).
# No namespace: applied into every opendatahub.io/dashboard=true project via
# the gpu-l40s-dra-claim-templates ACM policy namespaceSelector.
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: default
  labels:
    platform.opendatahub.io/part-of: kueue
  annotations:
    kueue.x-k8s.io/default-queue: 'true'
spec:
  clusterQueue: l40s-dra-cq
