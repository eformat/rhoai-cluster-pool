---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: kyverno
placementBindingDefaults:
  name: kyverno
policyDefaults:
  placement:
    placementName: placement-spoke-coco
  categories:
    - CM Configuration Management
  complianceType: "musthave"
  controls:
    - CM-2 Baseline Configuration
  consolidateManifests: false
  copyPolicyMetadata: false
  disabled: false
  namespace: openshift-gitops
  pruneObjectBehavior: "None"
  remediationAction: enforce
  recreateOption: IfRequired
  severity: medium
  standards:
    - NIST SP 800-53
  policyAnnotations: {"argocd.argoproj.io/compare-options": "IgnoreExtraneous"}
policies:
  - name: kyverno-coco-crds-a
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: spokes/crds-a/
  - name: kyverno-coco-crds-b
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: spokes/crds-b/
  - name: kyverno-coco-wgpolicy
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: spokes/wgpolicy/
  - name: kyverno-coco
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: spokes/workloads/
