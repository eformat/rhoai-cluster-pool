# Push the discovered KBS + Keycloak URLs to vault so spokes read them via
# ESO (the spoke initdata Job reads coco-config.KBS_URL; the spoke-realms
# Job reads coco-config.KEYCLOAK_URL). Replaces any bootstrap placeholder
# values seeded by secrets/vault-coco.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-coco-urls
  namespace: openshift-gitops
spec:
  updatePolicy: Replace
  deletionPolicy: Delete
  refreshInterval: 10s
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: coco-config
  data:
    - match:
        secretKey: KBS_URL
        remoteRef:
          remoteKey: ocp/sno/openshift-gitops/coco/config
          property: KBS_URL
    - match:
        secretKey: KEYCLOAK_URL
        remoteRef:
          remoteKey: ocp/sno/openshift-gitops/coco/config
          property: KEYCLOAK_URL
