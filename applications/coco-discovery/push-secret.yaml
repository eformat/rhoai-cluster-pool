# Push the discovered KBS + Keycloak URLs to vault so spokes read them via
# ESO (the spoke initdata Job reads coco-config.KBS_URL; the spoke-realms
# Job reads coco-config.KEYCLOAK_URL). Pushed to coco/urls — a dedicated
# ESO-owned vault secret (ESO must CREATE the target secret to own it, so
# it must not collide with the secrets/vault-coco-seeded coco/config).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-coco-urls
  namespace: openshift-gitops
spec:
  updatePolicy: Replace
  deletionPolicy: Delete
  refreshInterval: 10s
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: coco-config
  data:
    - match:
        secretKey: KBS_URL
        remoteRef:
          remoteKey: ocp/sno/openshift-gitops/coco/urls
          property: KBS_URL
    - match:
        secretKey: KEYCLOAK_URL
        remoteRef:
          remoteKey: ocp/sno/openshift-gitops/coco/urls
          property: KEYCLOAK_URL
