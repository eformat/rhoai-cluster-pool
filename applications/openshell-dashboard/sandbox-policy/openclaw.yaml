# Openclaw agent sandbox policy — validated on the coco spoke 2026-10-09.
#
# Authored policy YAML (the canonical schema — NOT the dashboard's display
# format): openshell-policy-schema, deny_unknown_fields, snake_case fields,
# lowercase enum values (enforce/audit, read-only/read-write/full).
#
# Gotchas validated the hard way:
# - github.com must be L4-only (protocol: tcp, no access/enforcement — the
#   protocol doesn't support them): git's smart-HTTP protocol needs a POST
#   with a binary packfile body, which the rest L7 inspection denies
#   (X-OpenShell-Policy: github, 403). api.github.com stays inspectable REST.
# - Network access is PER-BINARY: the github endpoints are gated to
#   /usr/bin/git — node to github is EACCES-blocked even though git works.
# - The MaaS endpoint starts as `audit` (log + allow) until the binary
#   identity is confirmed in the audit trail, then flips to `enforce`.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: ["/usr", "/lib", "/proc", "/app", "/etc", "/opt"]
  read_write: ["/sandbox", "/tmp"]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  github:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: github.com
        port: 443
        protocol: tcp
    binaries:
      - path: /usr/bin/git
  # MaaS egress is governed by the attached provider profile 'openai'
  # (applications/openshell-dashboard/provider-profiles/openai.yaml):
  # enforce, node binaries allowed, credential placeholder resolved by the
  # proxy workspace-side. Do NOT re-add a maas endpoint here — it would
  # overlap _provider_openai and fail the ambiguity validation.

