---
# Supplementary RBAC for maas-controller EA2 build — adds MaasTenantConfig
# and APIServer rules not present in the operator-managed ClusterRole.
# Additive-only: does not touch the operator-owned maas-controller-role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-controller-ea2-supplement
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: ["maas.opendatahub.io"]
  resources: ["maastenantconfigs","maastenantconfigs/status","maastenantconfigs/finalizers"]
  verbs: ["get","list","watch","create","update","patch","delete"]
- apiGroups: ["config.openshift.io"]
  resources: ["apiservers"]
  verbs: ["get","list","watch"]
- apiGroups: ["opentelemetry.io"]
  resources: ["opentelemetrycollectors"]
  verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-controller-ea2-supplement
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-controller-ea2-supplement
subjects:
- kind: ServiceAccount
  name: maas-controller
  namespace: redhat-ods-applications
---
# Allows the IPP (payload-processing SA) to patch HTTPRoutes in any namespace.
# Required for the merge-patch approach to set parentRef without resourceVersion conflicts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipp-httproute-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipp-httproute-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipp-httproute-patcher
subjects:
- kind: ServiceAccount
  name: payload-processing
  namespace: openshift-ingress
