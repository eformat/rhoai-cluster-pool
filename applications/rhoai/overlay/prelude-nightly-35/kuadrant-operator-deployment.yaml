---
# Pin kuadrant-operator to build with EnvoyFilter merge-patch fix.
# Fixes self-perpetuating reconcile storm: resource.Update() → watch event
# → reconcile → Update() loop that saturates etcd on SNO clusters.
# ArgoCD owns this — if RHCL CSV reverts the image, ArgoCD force-syncs it back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuadrant-operator-controller-manager
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "Force=true"
spec:
  template:
    spec:
      containers:
      - name: manager
        image: quay.io/eformat/kuadrant-operator:envoyfilter-merge-patch-fix
        imagePullPolicy: Always
