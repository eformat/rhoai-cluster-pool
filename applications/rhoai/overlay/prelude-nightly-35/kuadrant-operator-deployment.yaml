---
# Pin kuadrant-operator to build with EnvoyFilter merge-patch fix.
# Fixes self-perpetuating reconcile storm: resource.Update() → watch event
# → reconcile → Update() loop that saturates etcd on SNO clusters.
# Must patch the CSV — OLM reads the image from CSV and overwrites the Deployment.
#
# See: https://github.com/Kuadrant/kuadrant-operator/pull/2177
#
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: rhcl-operator.v1.4.2
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  install:
    spec:
      deployments:
      - name: kuadrant-operator-controller-manager
        spec:
          template:
            spec:
              containers:
              - name: manager
                image: quay.io/eformat/kuadrant-operator:rhcl-envoyfilter-merge-patch-fix
                imagePullPolicy: Always
