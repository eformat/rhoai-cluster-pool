---
# EvalHub enablement for the RHOAI 3.6 Evaluations page (Tech Preview).
# Without this chain the Evaluations page shows "Evaluations unavailable —
# EvalHub custom resources are currently unavailable".
#
# 1. TrustyAI CR patch — spec.enabledServices.evalHub=true. The TrustyAI
#    module operator redeploys the TrustyAI service operator with EVALHUB in
#    --enable-services, registering the evalhubs.trustyai.opendatahub.io CRD.
#    ServerSideApply so ArgoCD owns ONLY enabledServices — the DSC controller
#    keeps managing the rest of the CR it generated (managementState,
#    mcpGuardrailsMode, eval). Sync-wave 2 so it lands after dsc-cr (wave 1)
#    has created the component CR.
#    NOTE (2026-10-25): the 3.6.0-ea.2 pinned odh-trustyai-module-operator
#    predates the enabledServices injection (trustyai-service-operator
#    #915/#920, main since 2026-09-13 — the flag value is EVALHUB, no
#    underscore; empty --enable-services enables ALL services). In ea.2 the
#    knob is inert and the operator enforces --enable-services=NEMO_GUARDRAILS
#    (reverting external patches), so the CRD cannot register and this policy
#    violates on the EvalHub mapping until the platform ships a module
#    operator including #915/#920. The manifests below are correct and
#    converge when it does.
# 2. RBAC + EvalHub CR — mirrors the proven prelude-nightly-35 pattern:
#    proxy-access Role/RoleBinding for all authenticated users, the aggregated
#    evaluator ClusterRole, and the EvalHub CR (sqlite — the CRD's documented
#    lightweight path; for postgresql the CRD requires a pre-composed db-url
#    key in the referenced secret, else the server pod fails FailedMount).
---
# STOPGAP (2026-10-25, like the trustyai-llm-demo bundle): ship the
# evalhubs CRD itself until the platform pins an odh-trustyai-module-operator
# including trustyai-service-operator #915/#920 (the enabledServices ->
# --enable-services injection). In ea.2 the knob is inert, so the CRD cannot
# register via the operator; shipping it here unblocks the EvalHub CR
# mapping. Serves v1alpha1 — the version the EvalHub CR uses below.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
    app.kubernetes.io/part-of: trustyai
  name: evalhubs.trustyai.opendatahub.io
spec:
  group: trustyai.opendatahub.io
  names:
    kind: EvalHub
    listKind: EvalHubList
    plural: evalhubs
    singular: evalhub
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EvalHub is the Schema for the evalhubs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvalHubSpec defines the desired state of EvalHub
            properties:
              database:
                description: |-
                  Database configuration for persistent storage.
                  When set, the operator configures PostgreSQL via the referenced secret.
                  When omitted, the service uses its default (in-memory SQLite).
                properties:
                  maxIdleConns:
                    default: 5
                    description: Maximum number of idle database connections
                    type: integer
                  maxOpenConns:
                    default: 25
                    description: Maximum number of open database connections
                    type: integer
                  secret:
                    description: Name of the K8s Secret containing a pre-composed
                      db-url key
                    type: string
                required:
                - secret
                type: object
              env:
                description: Environment variables for the eval-hub container
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              description: |-
                                Name of the referent.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              description: |-
                                Name of the referent.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              replicas:
                default: 1
                description: Number of replicas for the eval-hub deployment
                format: int32
                minimum: 1
                type: integer
            type: object
          status:
            description: EvalHubStatus defines the observed state of EvalHub
            properties:
              activeProviders:
                description: List of active providers
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              lastUpdateTime:
                description: Last time the status was updated
                format: date-time
                type: string
              phase:
                description: Current phase of the EvalHub (Pending, Ready, Error)
                enum:
                - Pending
                - Ready
                - Error
                type: string
              ready:
                description: Ready indicates whether the EvalHub is ready to serve
                  requests
                type: string
              readyReplicas:
                description: Number of ready replicas
                format: int32
                type: integer
              replicas:
                description: Number of desired replicas
                format: int32
                type: integer
              url:
                description: URL where the EvalHub service is accessible
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: components.platform.opendatahub.io/v1alpha1
kind: TrustyAI
metadata:
  name: default-trustyai
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  enabledServices:
    evalHub: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalhub-proxy-access
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
- apiGroups:
  - trustyai.opendatahub.io
  resources:
  - evalhubs
  - evalhubs/proxy
  verbs:
  - get
  - list
  - watch
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-proxy-all-users
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-proxy-access
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-evalhub-permissions
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
- apiGroups:
  - trustyai.opendatahub.io
  resources:
  - evalhubs
  - evalhubs/proxy
  - evaluations
  - collections
  - providers
  - lmevaljobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - trustyai.opendatahub.io
  resources:
  - lmevaljobs/status
  verbs:
  - get
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: EvalHub
metadata:
  name: evalhub
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  env:
    - name: MLFLOW_TRACKING_URI
      value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
  database:
    type: sqlite
  providers:
    - lm-evaluation-harness
    - garak
    - garak-kfp
    - guidellm
    - lighteval
    - ibm-clear
  collections:
    - leaderboard-v2
    - safety-and-fairness-v1
    - toxicity-and-ethical-principles
