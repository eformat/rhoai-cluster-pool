# RBAC for the spoke-realms Job — discover coco-* managed clusters.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spoke-realms
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spoke-realms-clusters-reader
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["list", "get"]
  - apiGroups: ["hive.openshift.io"]
    resources: ["clusterclaims", "clusterdeployments"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spoke-realms-clusters-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spoke-realms-clusters-reader
subjects:
  - kind: ServiceAccount
    name: spoke-realms
    namespace: openshift-gitops
