# Per-spoke Keycloak realm creation.
# Discovers coco-* managed clusters on the hub and creates a realm per
# spoke in the hub Keycloak, with a client for the spoke's OpenShell
# agents. The spoke uses its realm for OIDC (OpenShift OAuth and agents).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spoke-realms-script
  namespace: openshift-gitops
data:
  realms.py: |
    #!/usr/bin/env python3
    """Create a Keycloak realm per coco-* managed cluster.

    Runs on the hub. Discovers coco-* managed clusters via the ACM API and
    ensures each has a realm (named <prefix>-<cluster>) with a client for
    the spoke's OpenShell agents, gateway-RBAC realm roles, and a
    confidential openshell-dashboard client (oauth2-proxy) with a
    realm-roles mapper. Idempotent: existing realms/clients/roles are
    left alone (409 = OK).
    """
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request

    KEYCLOAK_URL = os.environ.get("KEYCLOAK_URL", "").rstrip("/")
    REALM_PREFIX = os.environ.get("REALM_PREFIX", "coco")
    AGENT_CLIENT_ID = os.environ.get("AGENT_CLIENT_ID", "openshell-agents")
    # Dashboard oauth2-proxy client (confidential). The secret comes from
    # vault (spoke-realms-config ESO); without it the dashboard client is
    # skipped so the job stays green until vault is seeded.
    DASHBOARD_CLIENT_ID = os.environ.get("DASHBOARD_CLIENT_ID", "openshell-dashboard")
    DASHBOARD_CLIENT_SECRET = os.environ.get("DASHBOARD_CLIENT_SECRET", "")
    DASHBOARD_REDIRECT_URI = os.environ.get(
        "DASHBOARD_REDIRECT_URI", "https://openshell-dashboard.apps.*"
    )
    # Gateway OIDC RBAC roles (realm roles, surfaced in a flat `roles` claim
    # by the protocol mapper below).
    ADMIN_ROLE = os.environ.get("DASHBOARD_ADMIN_ROLE", "openshell-admin")
    USER_ROLE = os.environ.get("DASHBOARD_USER_ROLE", "openshell-user")
    CLI_CLIENT_ID = os.environ.get("CLI_CLIENT_ID", "openshell-cli")
    ADMIN_USER = os.environ.get("KEYCLOAK_ADMIN_USER", "")
    ADMIN_PASSWORD = os.environ.get("KEYCLOAK_ADMIN_PASSWORD", "")

    if not KEYCLOAK_URL or not ADMIN_USER or not ADMIN_PASSWORD:
        raise SystemExit(
            "KEYCLOAK_URL, KEYCLOAK_ADMIN_USER and KEYCLOAK_ADMIN_PASSWORD "
            "must be set (from spoke-realms-config + keycloak-admin secret)"
        )

    K8S_CTX = ssl.create_default_context(
        cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    )

    def k8s_api(path):
        token = open(
            "/var/run/secrets/kubernetes.io/serviceaccount/token"
        ).read().strip()
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/json",
            },
        )
        with urllib.request.urlopen(req, context=K8S_CTX) as resp:
            return json.loads(resp.read())

    def kc_api(method, path, payload=None, token=None):
        headers = {"Accept": "application/json"}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        data = json.dumps(payload).encode() if payload else None
        if data:
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(
            f"{KEYCLOAK_URL}{path}", data=data, method=method, headers=headers
        )
        try:
            with urllib.request.urlopen(req) as resp:
                body = resp.read()
                return resp.status, json.loads(body) if body else None
        except urllib.error.HTTPError as e:
            return e.code, None

    def admin_token():
        from urllib.parse import urlencode
        data = urlencode(
            {
                "grant_type": "password",
                "client_id": "admin-cli",
                "username": ADMIN_USER,
                "password": ADMIN_PASSWORD,
            }
        ).encode()
        req = urllib.request.Request(
            f"{KEYCLOAK_URL}/realms/master/protocol/openid-connect/token",
            data=data,
            method="POST",
            headers={"Content-Type": "application/x-www-form-urlencoded"},
        )
        with urllib.request.urlopen(req) as resp:
            return json.loads(resp.read())["access_token"]

    def coco_clusters():
        items = k8s_api(
            "/apis/cluster.open-cluster-management.io/v1/managedclusters"
        )["items"]
        return [
            c["metadata"]["name"]
            for c in items
            if c["metadata"]["name"].startswith(f"{REALM_PREFIX}-")
            and c["metadata"]["name"] != "local-cluster"
        ]

    def ensure_realm(token, realm):
        status, _ = kc_api("POST", f"/admin/realms", {
            "realm": realm,
            "enabled": True,
            "registrationAllowed": False,
        }, token)
        if status == 409:
            print(f"realm {realm} already exists")
        elif status not in (200, 201):
            print(f"WARN: realm {realm} create returned HTTP {status}")
            return
        else:
            print(f"created realm {realm}")

        # Client for the spoke's OpenShell agents
        status, _ = kc_api("POST", f"/admin/realms/{realm}/clients", {
            "clientId": AGENT_CLIENT_ID,
            "enabled": True,
            "protocol": "openid-connect",
            "publicClient": False,
            "secret": None,
            "redirectUris": [f"https://{realm}.*"],
            "standardFlowEnabled": True,
        }, token)
        if status == 409:
            print(f"client {AGENT_CLIENT_ID} already exists in realm {realm}")
        elif status not in (200, 201):
            print(
                f"WARN: client {AGENT_CLIENT_ID} in realm {realm} "
                f"returned HTTP {status}"
            )
        else:
            print(f"created client {AGENT_CLIENT_ID} in realm {realm}")

        # Realm roles for the gateway's OIDC RBAC (admin/user). Users are
        # assigned in the Keycloak console.
        for role in (ADMIN_ROLE, USER_ROLE):
            status, _ = kc_api("POST", f"/admin/realms/{realm}/roles", {
                "name": role,
            }, token)
            if status == 409:
                print(f"role {role} already exists in realm {realm}")
            elif status not in (200, 201):
                print(f"WARN: role {role} in realm {realm} returned HTTP {status}")
            else:
                print(f"created role {role} in realm {realm}")

        # Public client for the OpenShell CLI (browser login, localhost
        # loopback redirect, PKCE). The CLI's PKCE login redirects to
        # http://127.0.0.1:<ephemeral-port>/callback (oidc_auth.rs) —
        # 127.0.0.1 with a /callback path, NOT localhost:*. Loopback
        # patterns without a port match any ephemeral port (RFC 8252); the
        # :* patterns cover Keycloak builds without that flexibility.
        status, _ = kc_api("POST", f"/admin/realms/{realm}/clients", {
            "clientId": CLI_CLIENT_ID,
            "enabled": True,
            "protocol": "openid-connect",
            "publicClient": True,
            "redirectUris": [
                "http://127.0.0.1/callback",
                "http://127.0.0.1:*/callback",
                "http://localhost/callback",
                "http://localhost:*/callback",
            ],
            "standardFlowEnabled": True,
            "attributes": {"pkce.code.challenge.method": "S256"},
        }, token)
        if status == 409:
            print(f"client {CLI_CLIENT_ID} already exists in realm {realm}")
        elif status not in (200, 201):
            print(f"WARN: client {CLI_CLIENT_ID} in realm {realm} returned HTTP {status}")
        else:
            print(f"created client {CLI_CLIENT_ID} in realm {realm}")

        # Mappers for the CLI client so its tokens pass the gateway's JWT
        # validation:
        # - realm-roles: flat `roles` claim so rolesClaim RBAC sees the
        #   user's roles (adminRole/userRole check).
        # - aud-<dashboard>: adds the dashboard client id (the gateway's
        #   OIDC audience) to the token's `aud` claim — without it the
        #   gateway rejects CLI tokens ("invalid token"), same trap as the
        #   BFF audience issue.
        status, cli_clients = kc_api(
            "GET",
            f"/admin/realms/{realm}/clients?clientId={CLI_CLIENT_ID}",
            token=token,
        )
        if status != 200 or not cli_clients:
            print(f"WARN: could not resolve {CLI_CLIENT_ID} uuid in {realm}")
        else:
            cli_uuid = cli_clients[0]["id"]

            # Sync the CLI client's redirectUris if drifted: the job only
            # creates clients, so an existing CLI client would keep the old
            # (broken) http://localhost:* pattern forever otherwise.
            wanted_uris = [
                "http://127.0.0.1/callback",
                "http://127.0.0.1:*/callback",
                "http://localhost/callback",
                "http://localhost:*/callback",
            ]
            if cli_clients[0].get("redirectUris") != wanted_uris:
                cli_clients[0]["redirectUris"] = wanted_uris
                status, _ = kc_api(
                    "PUT",
                    f"/admin/realms/{realm}/clients/{cli_uuid}",
                    cli_clients[0],
                    token,
                )
                if status in (200, 204):
                    print(f"synced {CLI_CLIENT_ID} redirectUris in {realm}")
                else:
                    print(f"WARN: redirectUris sync in {realm} returned HTTP {status}")

            status, existing = kc_api(
                "GET",
                f"/admin/realms/{realm}/clients/{cli_uuid}/protocol-mappers/models",
                token=token,
            )
            names = [m.get("name") for m in (existing or [])]
            if "realm-roles" in names:
                print("mapper realm-roles already exists on " + CLI_CLIENT_ID)
            else:
                status, _ = kc_api(
                    "POST",
                    f"/admin/realms/{realm}/clients/{cli_uuid}/protocol-mappers/models",
                    {
                        "name": "realm-roles",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-realm-role-mapper",
                        "consentRequired": False,
                        "config": {
                            "multivalued": "true",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true",
                            "claim.name": "roles",
                            "jsonType.label": "String",
                        },
                    },
                    token,
                )
                if status in (200, 201):
                    print(f"created mapper realm-roles on {CLI_CLIENT_ID} in {realm}")
                else:
                    print(f"WARN: cli realm-roles mapper in {realm} returned HTTP {status}")
            aud_mapper = f"aud-{DASHBOARD_CLIENT_ID}"
            if aud_mapper in names:
                print(f"mapper {aud_mapper} already exists on " + CLI_CLIENT_ID)
            else:
                status, _ = kc_api(
                    "POST",
                    f"/admin/realms/{realm}/clients/{cli_uuid}/protocol-mappers/models",
                    {
                        "name": aud_mapper,
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-audience-resolve-mapper",
                        "consentRequired": False,
                        "config": {
                            "included.client.audience": DASHBOARD_CLIENT_ID,
                        },
                    },
                    token,
                )
                if status in (200, 201):
                    print(f"created mapper {aud_mapper} on {CLI_CLIENT_ID} in {realm}")
                else:
                    print(f"WARN: cli audience mapper in {realm} returned HTTP {status}")

        # Confidential client for the openshell-dashboard's oauth2-proxy.
        # Registered with the SAME issuer the gateway trusts; its client_id
        # must match the gateway's OIDC audience.
        if not DASHBOARD_CLIENT_SECRET:
            print(
                f"SKIP: dashboard client {DASHBOARD_CLIENT_ID} in realm "
                f"{realm}: DASHBOARD_CLIENT_SECRET not seeded in vault"
            )
            return

        status, _ = kc_api("POST", f"/admin/realms/{realm}/clients", {
            "clientId": DASHBOARD_CLIENT_ID,
            "enabled": True,
            "protocol": "openid-connect",
            "publicClient": False,
            "secret": DASHBOARD_CLIENT_SECRET,
            "redirectUris": [DASHBOARD_REDIRECT_URI],
            "standardFlowEnabled": True,
        }, token)
        if status == 409:
            print(f"client {DASHBOARD_CLIENT_ID} already exists in realm {realm}")
        elif status not in (200, 201):
            print(
                f"WARN: client {DASHBOARD_CLIENT_ID} in realm {realm} "
                f"returned HTTP {status}"
            )
            return
        else:
            print(f"created client {DASHBOARD_CLIENT_ID} in realm {realm}")

        status, clients = kc_api(
            "GET",
            f"/admin/realms/{realm}/clients?clientId={DASHBOARD_CLIENT_ID}",
            token=token,
        )
        if status != 200 or not clients:
            print(f"WARN: could not resolve {DASHBOARD_CLIENT_ID} uuid in {realm}")
            return
        client_uuid = clients[0]["id"]

        # Vault is the source of truth: sync the client secret if it drifted
        # (e.g. after a rotation in vault).
        status, cur = kc_api(
            "GET", f"/admin/realms/{realm}/clients/{client_uuid}/secret",
            token=token,
        )
        if status == 200 and cur and cur.get("value") != DASHBOARD_CLIENT_SECRET:
            status, rep = kc_api(
                "GET", f"/admin/realms/{realm}/clients/{client_uuid}", token=token
            )
            if status == 200 and rep:
                rep["secret"] = DASHBOARD_CLIENT_SECRET
                status, _ = kc_api(
                    "PUT", f"/admin/realms/{realm}/clients/{client_uuid}", rep, token
                )
                if status in (200, 204):
                    print("synced dashboard client secret from vault")
                else:
                    print(f"WARN: secret sync returned HTTP {status}")

        # Realm-roles mapper: emits the user's realm roles in a flat
        # `roles` claim (id token + access token + userinfo) so the gateway
        # can read RBAC roles from `rolesClaim: roles`.
        status, existing = kc_api(
            "GET",
            f"/admin/realms/{realm}/clients/{client_uuid}/protocol-mappers/models",
            token=token,
        )
        names = [m.get("name") for m in (existing or [])]
        if "realm-roles" in names:
            print("mapper realm-roles already exists on " + DASHBOARD_CLIENT_ID)
            return
        status, _ = kc_api(
            "POST",
            f"/admin/realms/{realm}/clients/{client_uuid}/protocol-mappers/models",
            {
                "name": "realm-roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": False,
                "config": {
                    "multivalued": "true",
                    "id.token.claim": "true",
                    "access.token.claim": "true",
                    "userinfo.token.claim": "true",
                    "claim.name": "roles",
                    "jsonType.label": "String",
                },
            },
            token,
        )
        if status in (200, 201):
            print(f"created mapper realm-roles on {DASHBOARD_CLIENT_ID} in {realm}")
        else:
            print(f"WARN: mapper create in realm {realm} returned HTTP {status}")

    def main():
        token = admin_token()
        clusters = coco_clusters()
        if not clusters:
            print(f"no {REALM_PREFIX}-* managed clusters found yet")
            return
        for cluster in clusters:
            realm = f"{REALM_PREFIX}-{cluster}"
            ensure_realm(token, realm)

    main()
    print("spoke realms OK")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spoke-realms
  namespace: openshift-gitops
spec:
  backoffLimit: 4
  template:
    metadata:
      name: spoke-realms
    spec:
      serviceAccountName: spoke-realms
      restartPolicy: Never
      containers:
        - name: realms
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/scripts/realms.py"]
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: spoke-realms-config
                  key: KEYCLOAK_URL
            - name: REALM_PREFIX
              valueFrom:
                secretKeyRef:
                  name: spoke-realms-config
                  key: REALM_PREFIX
            - name: AGENT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spoke-realms-config
                  key: AGENT_CLIENT_ID
            - name: DASHBOARD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spoke-realms-config
                  key: DASHBOARD_CLIENT_ID
                  optional: true
            - name: DASHBOARD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spoke-realms-config
                  key: DASHBOARD_CLIENT_SECRET
                  optional: true
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
                  optional: true
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
                  optional: true
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: spoke-realms-script
