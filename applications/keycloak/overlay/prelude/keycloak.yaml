---
# Source: keycloak-auth/templates/keycloak.yaml
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  db:
    vendor: postgres
    database: keycloak-postgres
    host: keycloak-postgres-rw
    usernameSecret:
      name: keycloak-postgres-app
      key: username
    passwordSecret:
      name: keycloak-postgres-app
      key: password
  hostname:
    strict: false
    strictBackchannel: false
  http:
    httpEnabled: False
    tlsSecret: keycloak-internal-tls
  ingress:
    enabled: false
  instances: 2
  transaction:
    xaEnabled: true
  additionalOptions:
    - name: enable-recovery
      value: 'true'
  unsupported:
    podTemplate:
      spec:
        containers:
          # Java4Shell (CVE-2026-114938) mitigation: disable the vulnerable
          # AVX-512 Base64 intrinsic until the rhbk base image ships a patched
          # OpenJDK (calif.io/java4shell#recommendations + OpenJDK advisory
          # 2026-11-17). Remove once the image is patched.
          - env:
              - name: JDK_JAVA_OPTIONS
                value: -XX:-UseBASE64Intrinsics
            volumeMounts:
              - name: prelude-theme
                mountPath: /opt/keycloak/themes/prelude/login/theme.properties
                subPath: theme.properties
              - name: prelude-theme
                mountPath: /opt/keycloak/themes/prelude/login/resources/css/styles.css
                subPath: styles.css
        volumes:
          - name: prelude-theme
            configMap:
              name: keycloak-theme-prelude
