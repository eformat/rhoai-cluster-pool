# KBS endpoint + security policy flavour for initdata generation.
# Pattern B (hub-trusted): the ESO runs on the HUB, reads the values from
# vault and bakes them into a Policy; ACM copies the values to the spoke as
# a plain Secret (ns imperative). No ESO on the spoke.
# KBS_URL is pushed to vault by the coco-discovery app (push-secret.yaml);
# SECURITY_POLICY_FLAVOUR is seeded by secrets/vault-coco (coco/config).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coco-config-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: coco-config-spokes
    manifest:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          policy.open-cluster-management.io/categories: CM Configuration Management
          policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
          policy.open-cluster-management.io/standards: NIST SP 800-53
        labels:
          requires-rolling-restart: none
      templateFrom:
      - literal: |
          disabled: false
          policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: coco-config-spokes
              spec:
                object-templates:
                  - complianceType: musthave
                    objectDefinition:
                      kind: Secret
                      apiVersion: v1
                      stringData:
                        KBS_URL: {{.kbsUrl}}
                        SECURITY_POLICY_FLAVOUR: {{.securityPolicyFlavour}}
                      metadata:
                        name: coco-config
                        namespace: imperative
                      type: Opaque
                remediationAction: inform
                severity: low
          remediationAction: enforce
        target: spec
  data:
  - secretKey: kbsUrl
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/urls
      property: KBS_URL
  - secretKey: securityPolicyFlavour
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/config
      property: SECURITY_POLICY_FLAVOUR
