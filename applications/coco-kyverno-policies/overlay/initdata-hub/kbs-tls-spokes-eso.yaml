# KBS TLS certificate for pod initdata. Pattern B (hub-trusted): the ESO
# runs on the HUB, reads the certificate from vault (pushed by the trustee
# app's push-secret.yaml) and bakes it into a Policy; ACM copies it to the
# spoke as a plain Secret (ns imperative). The initdata Job embeds it so
# the CoCo guest can trust the KBS endpoint.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-tls-spokes
  namespace: openshift-gitops
spec:
  refreshInterval: "60s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kbs-tls-spokes
    manifest:
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          policy.open-cluster-management.io/categories: CM Configuration Management
          policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
          policy.open-cluster-management.io/standards: NIST SP 800-53
        labels:
          requires-rolling-restart: none
      templateFrom:
      - literal: |
          disabled: false
          policy-templates:
          - objectDefinition:
              apiVersion: policy.open-cluster-management.io/v1
              kind: ConfigurationPolicy
              metadata:
                name: kbs-tls-spokes
              spec:
                object-templates:
                  - complianceType: musthave
                    objectDefinition:
                      kind: Secret
                      apiVersion: v1
                      stringData:
                        tls.crt: {{ .tlsCrt | quote }}
                      metadata:
                        name: kbs-tls-self-signed
                        namespace: imperative
                      type: Opaque
                remediationAction: inform
                severity: low
          remediationAction: enforce
        target: spec
  data:
  - secretKey: tlsCrt
    remoteRef:
      key: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
      property: tls.crt
