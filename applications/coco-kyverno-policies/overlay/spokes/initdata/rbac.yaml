# RBAC for the initdata Job — manage initdata ConfigMaps in `imperative`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: initdata-gzipper
  namespace: imperative
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: initdata-gzipper
  namespace: imperative
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: initdata-gzipper
  namespace: imperative
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: initdata-gzipper
subjects:
  - kind: ServiceAccount
    name: initdata-gzipper
    namespace: imperative
