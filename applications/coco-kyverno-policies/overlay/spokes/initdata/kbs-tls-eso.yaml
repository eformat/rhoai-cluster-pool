# KBS TLS certificate from the hub trustee app. The hub pushes
# kbs-tls-self-signed to vault (trustee/overlay/hub/push-secret.yaml); the
# initdata Job embeds the certificate into pod initdata so the CoCo guest
# can trust the KBS endpoint.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-tls
  namespace: imperative
spec:
  refreshInterval: "1m0s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kbs-tls-self-signed
    creationPolicy: Owner
  data:
    - secretKey: tls.crt
      remoteRef:
        key: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
        property: tls.crt
