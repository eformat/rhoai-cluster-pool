# Per-user agent definitions. Each user gets a CoCo agent pod
# (kata-remote peer pod), an ESO for their model/API keys, a Service and a
# Route. All users share the `coco-agents` namespace so the kyverno
# initdata propagation and governance policies apply to everyone.
# To add a user, append an entry here and push.
users:
  - name: alice
    profile: data-science

# AIPCC OpenClaw agent image (confidential-containers agent base image).
image: quay.io/aipcc/base-images/agentic/openclaw@sha256:896d1526ee29b53167034ba65d1c758c8da777f441ed094e19f3bcf6d7445c61

# Vault path prefix for per-user agent secrets
# (kv/data/ocp/sno/openshift-gitops/coco/users/<name>).
vaultPrefix: kv/data/ocp/sno/openshift-gitops/coco/users
