{{- include "coco-agents.validate" . -}}
{{- range $user := .Values.users | default list }}
---
# Per-user agent API/model keys, pulled from vault by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-{{ $user.name }}-secrets
  namespace: coco-agents
  labels:
    {{- include "coco-agents.labels" (dict "root" $ "name" $user.name) | nindent 4 }}
spec:
  refreshInterval: "1m0s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agent-{{ $user.name }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $.Values.vaultPrefix }}/{{ $user.name }}
{{- end }}
