{{- if and .Values.bff.enabled .Values.bff.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "community-plugins-admin.fullname" . }}-bff
  labels:
    {{- include "community-plugins-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
rules:
  # Manage namespaces for plugin deployments
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage workload resources created by plugin Helm charts
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage core resources created by plugin Helm charts
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm release secrets — watch not required for lifecycle operations
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage namespace-scoped RBAC resources created by plugin Helm charts
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage networking resources created by plugin Helm charts
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
{{- end }}
