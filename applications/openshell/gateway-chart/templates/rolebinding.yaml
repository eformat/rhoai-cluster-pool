apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell.fullname" . }}-sandbox
  namespace: {{ include "openshell.sandboxNamespace" . }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell.serviceAccountName" . }}
    # Same namespace resolution as the sandbox namespace (sandboxNamespace
    # helper) — .Release.Namespace leaks the ACM app's namespace through the
    # kustomize helm inflate, so bind the gateway's real ServiceAccount.
    namespace: {{ .Values.server.sandboxNamespace | default .Release.Namespace }}
{{- end }}
