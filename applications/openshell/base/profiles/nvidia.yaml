# OpenShell 0.1.x: sandboxes call NVIDIA's endpoint directly with the
# placeholder NVIDIA_API_KEY; the proxy puts in the real key only for these
# endpoints and binaries. OpenClaw runs under node, so node must be listed
# (a profile with no binaries allows nothing).
id: nvidia
display_name: NVIDIA Endpoints
description: NVIDIA API inference endpoints
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  # OpenClaw's node: /usr/bin/node-<major> in the Hummingbird image
  # (/usr/bin/node links to it; the real path is what is matched),
  # /usr/local/bin/node in the NemoClaw image.
  - /usr/bin/node
  - /usr/bin/node-*
  - /usr/local/bin/node
