---
namespace: openshell
helmGlobals:
  # Contains the vendored gateway-chart/ (OpenShell helm chart 0.1.2).
  chartHome: ../../
helmCharts:
  - name: gateway-chart
    includeCRDs: true
    releaseName: openshell
    valuesFile: values.yaml
resources:
  # Wildcard service Route + LE Certificate + Issuer + router RBAC — one
  # Route serves every exposed sandbox service URL under
  # openshell.apps.<domain> (see route-services.yaml for the design notes).
  - route-services.yaml
