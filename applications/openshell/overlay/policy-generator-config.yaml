---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: openshell
placementBindingDefaults:
  name: openshell
policyDefaults:
  placement:
    placementName: placement-spoke-coco
  categories:
    - CM Configuration Management
  complianceType: "musthave"
  controls:
    - CM-2 Baseline Configuration
  consolidateManifests: false
  copyPolicyMetadata: false
  disabled: false
  namespace: openshift-gitops
  pruneObjectBehavior: "None"
  remediationAction: enforce
  recreateOption: IfRequired
  severity: medium
  standards:
    - NIST SP 800-53
  policyAnnotations: {"argocd.argoproj.io/compare-options": "IgnoreExtraneous"}
policies:
  - name: openshell-coco
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: spokes/
  # The OpenShell gateway on the coco spoke — the helmChart (vendored chart
  # 0.1.2) renders to the policy's object-templates at kustomize build time.
  - name: openshell-gateway
    placement:
      placementName: placement-spoke-coco
    manifests:
      - path: gateway/
