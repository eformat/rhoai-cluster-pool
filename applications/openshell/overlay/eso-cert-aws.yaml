---
# Pattern (spoke-trusted, no vault): the aws-creds Secret for the
# cert-manager Route53 issuer in ns openshell is hydrated ON the spoke from
# the Hive-managed kube-system/aws-creds Secret via ACM's fromSecret
# (evaluated spoke-side, same pattern as policy-collection's
# aws-creds-spokes policy). No hostedZoneID: the Issuer discovers the zone by matching the
# challenge domain against the account's zones (needs ListHostedZones) —
# validated live, so no zone id is needed anywhere.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: openshell-cert-aws-spokes
  annotations:
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-3 Access Enforcement
    policy.open-cluster-management.io/standards: NIST SP 800-53
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: openshell-cert-aws-spokes
      spec:
        object-templates:
        - complianceType: musthave
          objectDefinition:
            kind: Secret
            apiVersion: v1
            metadata:
              name: aws-creds
              namespace: openshell
            type: Opaque
            data:
              access_key_id: '{{fromSecret "kube-system" "aws-creds" "aws_access_key_id"}}'
              aws_secret_access_key: '{{fromSecret "kube-system" "aws-creds" "aws_secret_access_key"}}'
        remediationAction: inform
        severity: low
---
# Binds the cert-aws Policy to the coco spoke placement — same pattern as
# the dashboard's placement-binding. metadata.namespace MUST be explicit: a
# namespace-less binding silently lands in the ArgoCD app's destination
# namespace and the ACM propagator never sees it (the policy never
# distributes, with no status, events, or errors).
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-openshell-cert-aws
  namespace: openshift-gitops
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-spoke-coco
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: openshell-cert-aws-spokes
