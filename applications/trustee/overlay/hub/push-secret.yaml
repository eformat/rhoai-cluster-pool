# Push the KBS TLS secret to vault so coco spokes can embed the certificate
# in pod initdata (pulled by the coco-kyverno-policies initdata Job).
# Ported from validatedpatterns/trustee-chart templates/push-secret.yaml.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-kbs-certs
  namespace: imperative
spec:
  updatePolicy: Replace
  deletionPolicy: Delete
  refreshInterval: 10s
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: kbs-tls-self-signed
  data:
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
          property: tls.key
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
          property: tls.crt
