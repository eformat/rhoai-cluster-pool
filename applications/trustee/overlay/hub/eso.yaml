# KBS secrets pulled from vault (seeded by secrets/vault-coco).
# Ported from validatedpatterns/trustee-chart templates/dynamic-eso.yaml and
# attestation-status-eso.yaml, plus security-policy delivery.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbsres1-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kbsres1
  dataFrom:
    - extract:
        key: kv/data/ocp/sno/openshift-gitops/coco/kbsres1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passphrase-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: passphrase
  dataFrom:
    - extract:
        key: kv/data/ocp/sno/openshift-gitops/coco/passphrase
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attestation-status-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: attestation-status
  dataFrom:
    - extract:
        key: kv/data/ocp/sno/openshift-gitops/coco/attestationStatus
---
# Image security policy served at kbs:///default/security-policy/<flavour>.
# Keys: insecure | reject | signed (from bootstrap/seed-vault-coco.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: security-policy-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: security-policy
  dataFrom:
    - extract:
        key: kv/data/ocp/sno/openshift-gitops/coco/securityPolicyConfig
---
# KBS HTTPS termination secrets — the trustee operator's KbsConfig mounts
# kbsHttpsKeySecretName/kbsHttpsCertSecretName for the KBS TLS endpoint.
# Same cert the KBS serves to spokes (kbs-tls-self-signed, pushed to vault
# by push-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-https-key-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kbs-https-key
  data:
    - secretKey: tls.key
      remoteRef:
        key: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
        property: tls.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-https-certificate-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kbs-https-certificate
  data:
    - secretKey: tls.crt
      remoteRef:
        key: kv/data/ocp/sno/openshift-gitops/coco/kbs-tls-self-signed
        property: tls.crt
