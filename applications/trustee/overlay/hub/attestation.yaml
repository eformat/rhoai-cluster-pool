# Attestation service TLS certificate + attestation policy.
# Ported from validatedpatterns/trustee-chart templates/attestation-issuer.yaml,
# attestation-certificate.yaml and attestation-policy.yaml.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: attestation-self-signed-issuer
  namespace: trustee-operator-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: attestation-token
  namespace: trustee-operator-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: attestation-cert
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: kbs-trustee-operator-system
  subject:
    organizations:
      - Red Hat
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: attestation-self-signed-issuer
    kind: Issuer
---
# EAR appraisal policy (AR4SI). Defaults (executables=33, hardware=97,
# configuration=36) apply to TEE platforms not explicitly handled below —
# e.g. non-TEE AWS peer pods. TDX/SNP/Azure sections kept for parity with
# the validatedpatterns trustee-chart for when TEE hardware is added.
apiVersion: v1
kind: ConfigMap
metadata:
  name: attestation-policy
  namespace: trustee-operator-system
data:
  default_cpu.rego: |
    package policy

    import rego.v1

    # This policy validates multiple TEE platforms.
    # It is used to generate an EAR Appraisal (AR4SI result).
    # https://datatracker.ietf.org/doc/draft-ietf-rats-ar4si/

    # executables: 33 = "Runtime memory includes unrecognized executables"
    default executables := 33

    # hardware: 97 = "Verifier does not recognize attester's hardware"
    default hardware := 97

    # configuration: 36 = "Security-relevant configuration unavailable"
    default configuration := 36

    default file_system := 0
    default instance_identity := 0
    default runtime_opaque := 0
    default storage_opaque := 0
    default sourced_data := 0

    trust_claims := {
      "executables": executables,
      "hardware": hardware,
      "configuration": configuration,
      "file-system": file_system,
      "instance-identity": instance_identity,
      "runtime-opaque": runtime_opaque,
      "storage-opaque": storage_opaque,
      "sourced-data": sourced_data,
    }

    extensions := [
      {"name": "ear.trustee.identifiers",
        "key": -18,
        "value": {
          "validated": validated_identifiers
        }
      }
    ]

    validated_identifiers := object.union_n([
        container_images_id,
        container_uids_id,
    ])

    container_images := [img |
        container := input["init_data_claims"]["agent_policy_claims"]["containers"][_]
        img := container["OCI"]["Annotations"]["io.kubernetes.cri.image-name"]
    ]

    container_images_id := {"container_images": container_images} if {
        count(container_images) > 0
    } else := {}

    container_uids := [uid |
        container := input["init_data_claims"]["agent_policy_claims"]["containers"][_]
        uid := container["OCI"]["Process"]["User"]["UID"]
    ]

    container_uids_id := {"container_uids": container_uids} if {
        count(container_uids) > 0
    } else := {}

    ##### Azure vTPM SNP
    executables := 3 if {
      input["az-snp-vtpm"]
      input["az-snp-vtpm"].tpm.pcr03 in query_reference_value("snp_pcr03")
      input["az-snp-vtpm"].tpm.pcr08 in query_reference_value("snp_pcr08")
      input["az-snp-vtpm"].tpm.pcr09 in query_reference_value("snp_pcr09")
      input["az-snp-vtpm"].tpm.pcr11 in query_reference_value("snp_pcr11")
      input["az-snp-vtpm"].tpm.pcr12 in query_reference_value("snp_pcr12")
    }

    hardware := 2 if {
      input["az-snp-vtpm"]
    }

    configuration := 2 if {
      input["az-snp-vtpm"]
    }

    ##### Azure vTPM TDX
    executables := 3 if {
      input["az-tdx-vtpm"]
      input["az-tdx-vtpm"].tpm.pcr03 in query_reference_value("tdx_pcr03")
      input["az-tdx-vtpm"].tpm.pcr08 in query_reference_value("tdx_pcr08")
      input["az-tdx-vtpm"].tpm.pcr09 in query_reference_value("tdx_pcr09")
      input["az-tdx-vtpm"].tpm.pcr11 in query_reference_value("tdx_pcr11")
      input["az-tdx-vtpm"].tpm.pcr12 in query_reference_value("tdx_pcr12")
    }

    hardware := 2 if {
      input["az-tdx-vtpm"]
      input["az-tdx-vtpm"].quote.header.tee_type == "81000000"
      input["az-tdx-vtpm"].quote.header.vendor_id == "939a7233f79c4ca9940a0db3957f0607"
      input["az-tdx-vtpm"].tcb_status == "UpToDate"
    }

    configuration := 2 if {
      input["az-tdx-vtpm"]
    }

    # Fallback: xfam reference values not available
    else := 3 if {
      input["az-tdx-vtpm"]
    }

    ##### Bare Metal TDX
    executables := 3 if {
      input["tdx"]
      input["tdx"].quote.body.rtmr_1 in query_reference_value("rtmr_1")
      input["tdx"].quote.body.rtmr_2 in query_reference_value("rtmr_2")
      input.init_data in query_reference_value("init_data")
    }

    else := 4 if {
      input["tdx"]
      input["tdx"].quote.body.rtmr_1 in query_reference_value("rtmr_1")
      input.init_data in query_reference_value("init_data")
    }

    hardware := 2 if {
      input["tdx"]
      input["tdx"].quote.header.tee_type == "81000000"
      input["tdx"].quote.header.vendor_id == "939a7233f79c4ca9940a0db3957f0607"
      input["tdx"].quote.body.mr_td in query_reference_value("mr_td")
      input["tdx"].tcb_status == "UpToDate"
      input["tdx"].collateral_expiration_status == "0"
    }

    else := 3 if {
      input["tdx"]
      input["tdx"].quote.header.tee_type == "81000000"
      input["tdx"].quote.header.vendor_id == "939a7233f79c4ca9940a0db3957f0607"
      input["tdx"].quote.body.mr_td in query_reference_value("mr_td")
      input["tdx"].collateral_expiration_status == "0"
    }

    configuration := 2 if {
      input["tdx"]
      input["tdx"].td_attributes.debug == false
      input["tdx"].quote.body.xfam in query_reference_value("xfam")
    }

    else := 3 if {
      input["tdx"]
      input["tdx"].td_attributes.debug == false
      input.init_data in query_reference_value("init_data")
    }
