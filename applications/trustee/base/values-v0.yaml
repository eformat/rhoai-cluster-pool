# list of operators
operators:
  # trustee operator (KBS)
  - name: trustee-operator
    namespace:
      name: trustee-operator-system
      create: true
      global: false
    channels: [stable]
    catalog: openshift-redhat-operators #v1
    source: redhat-operators # v0
    sourceNamespace: openshift-marketplace # v0
    enabled: true
