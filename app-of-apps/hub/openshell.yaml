# OpenShell gateway — deployed from the NVIDIA OCI helm chart.
# Sandboxes are created via the agent-sandbox operator (existing app); the
# CoCo agent pods (kata-remote) are deployed separately via
# openshell-agents.yaml -> applications/openshell.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshell
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: placement-hub-openshift
        requeueAfterSeconds: 180
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: openshell-{{.name}}
      annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
    spec:
      project: default
      destination:
        server: "{{.server}}"
        namespace: openshell
      sources:
        - repoURL: oci://ghcr.io/nvidia/openshell
          chart: helm-chart
          targetRevision: 0.0.103
          helm:
            valuesObject:
              pkiInitJob:
                enabled: false
              server:
                disableTls: true
                auth:
                  allowUnauthenticatedUsers: true
                sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
              podSecurityContext:
                fsGroup: null
              securityContext:
                runAsUser: null
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
