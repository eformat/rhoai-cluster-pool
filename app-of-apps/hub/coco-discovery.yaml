---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coco-discovery
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/eformat/rhoai-cluster-pool.git
    path: applications/coco-discovery
    targetRevision: main
    plugin:
      name: argocd-novault-plugin-kustomize
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
